openapi: 3.0.3
info:
  version: 2.0.0
  title: Intermediation EU
  contact:
    name: API Support
    url: https://www.digg.se/digitala-tjanster/tekniska-systemet-for-gransoverskridande-automatiskt-utbyte-av-bevis---oots
    email: sdg@digg.se
  license:
    name: CC0 1.0 Universal
    url: https://creativecommons.org/publicdomain/zero/1.0/legalcode.sv
  termsOfService: https://github.com/diggsweden/sdg-intermediation-eu/blob/main/TERMS_OF_SERVICE.md
  description: |
    This is the API for previewing evidences to be consumed in a Swedish procedure. 
    It covers both the retrieval of the preview link to a preview space as well as the actual 
    retrieval of the evidence.

    Detta API används för att förhandsgranska bevis så att de kan användas i svenska förfaranden.
    Det täcker in både att hämta länken för förhandsgransking i en förhandsgranskningstjänst och att sedan hämta det aktuella beviset.

    # Common Services
    This API also provides operations to query Evidence Broker and Data Service Directory of the Common Services.
    Data from Common Services is required input to access evidences directly or via preview spaces

    # Authorization
    For accessing any of the endpoints the requester needs to provide an authorization header with an access token acquired from the Authorization Server provided by Digg.

    An example for how to use bearerAuth:
    ``` 
    Authorization: Bearer <jwt-token>
    ```
  x-limitations: There are no known problems or limitations.
externalDocs:
  description: Further documentation of this API is provided at GitHub.
  url: https://github.com/diggsweden/sdg-intermediation-eu/blob/main/README.md
tags:
  - name: "API-info"
    description: "Info about this API"
  - name: "Common Services EB"
    description: "Common Services Evidence Broker"
  - name: "Common Services DSD"
    description: "Common Services Data Service Directory"
  - name: "Preview Sessions"
    description: "Requests for Evidence involving preview"
  - name: "Evidences"
    description: "Evidences directly without preview"
  - name: "Evidences selector link"
    description: "Request a link to Evidences selector frontend"

servers:
  - url: "https://intermediation-eu.oots.digg.se/api/v2"

paths:
  "/api-info":
    get:
      tags: [API-info]
      summary: Returns API metadata
      description: Returns API metadata
      operationId: apiInfo
      security: []
      responses:
        "200":
          $ref: "#/components/responses/ApiInfoResponse"
  "/common-services/eb/requirements":
    get:
      tags: ["Common Services EB"]
      summary: requirements-by-procedure-and-jurisdiction
      description: requirements-by-procedure-and-jurisdiction
      externalDocs:
        url: https://ec.europa.eu/digital-building-blocks/sites/pages/viewpage.action?pageId=706382120#id-3.1.4QueryInterfaceSpecificationoftheDSD(December2023)-4.2.Query:FindDataServicesofEvidenceProvidersforaspecificEvidenceTypeClassification
      operationId: getCsEbRequirements
      parameters:
        - name: procedureId
          in: query
          schema:
            $ref: "#/components/schemas/ProcedureId"
        - $ref: "#/components/parameters/countryParamOptional"
        - $ref: "#/components/parameters/adminLevelTwoParam"
        - $ref: "#/components/parameters/adminLevelThreeParam"
      responses:
        "200":
          description: "Requirement"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirements"
              examples:
                requirementsResponseExample:
                  $ref: "#/components/examples/RequirementsResponseExample"
        "400":
          description: "Bad request"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                eConstrainstViolationErrorResponseExample:
                  $ref: "#/components/examples/EbConstrainstViolationErrorResponseExample"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "404":
          description: "Requirements not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                eConstrainstViolationErrorResponseExample:
                  $ref: "#/components/examples/EbRequirementsNotFoundResponseExample"
        "500":
          $ref: "#/components/responses/ErrorResponse"

  "/common-services/eb/evidence-types/":
    get:
      tags: ["Common Services EB"]
      summary: evidence-types-by-requirement-and-jurisdiction
      description: evidence-types-by-requirement-and-jurisdiction
      externalDocs:
        url: https://ec.europa.eu/digital-building-blocks/sites/pages/viewpage.action?pageId=706382141#id-3.2.4QueryInterfaceSpecificationoftheEB(December2023)-4.3.GetEvidenceTypesforRequirementQuery
      operationId: getCsEbEvidenceTypes
      parameters:
        - name: requirementId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/RequirementId"
        - $ref: "#/components/parameters/countryParamOptional"
        - $ref: "#/components/parameters/adminLevelTwoParam"
        - $ref: "#/components/parameters/adminLevelThreeParam"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceTypes"
              examples:
                evidenceTypesExample:
                  $ref: "#/components/examples/evidenceTypesExample"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "404":
          description: "Evidence type not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                ebEvidenceTypeNotFoundResponseExample:
                  $ref: "#/components/examples/EbEvidenceTypeNotFoundResponseExample"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  "/common-services/eb/procedures":
    get:
      tags: ["Common Services EB"]
      summary: "Extracts procedures referenced by requirements returned by requirements-by-procedure-and-jurisdiction"
      description: "Extracts procedures referenced by requirements returned by requirements-by-procedure-and-jurisdiction"
      operationId: getCsEbProcedures
      parameters:
        - $ref: "#/components/parameters/countryParamOptional"
      responses:
        "200":
          description: "Procedures"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Procedures"
              examples:
                proceduresResponseExample:
                  $ref: "#/components/examples/ProceduresResponseExample"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "404":
          description: "Procedure not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                ebProcedureNotFoundResponseExample:
                  $ref: "#/components/examples/EbProceduresNotFoundResponseExample"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  "/common-services/dsd/data-services/{countryCode}":
    get:
      tags: ["Common Services DSD"]
      summary: dataservices-by-evidencetype-and-jurisdiction
      description: dataservices-by-evidencetype-and-jurisdiction
      operationId: getCsDsdDataServices
      parameters:
        - name: countryCode
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Country"
        - name: evidenceTypeClassification
          in: query
          schema:
            $ref: "#/components/schemas/EvidenceTypeClassification"

        - $ref: "#/components/parameters/adminLevelTwoParam"
        - $ref: "#/components/parameters/adminLevelThreeParam"
        - name: jurisdictionContextId
          in: query
          schema:
            type: string
        - name: evidenceTypeId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataServiceEvidenceType"
              example:
                DataServiceEvidenceTypeExample:
                  $ref: "#/components/examples/DataServiceEvidenceTypeExample"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "404":
          description: "Data Service not found"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
              examples:
                dsdNotFoundResponseExample:
                  $ref: "#/components/examples/DsdNotFoundErrorResponseExample"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  "/evidence/preview-sessions":
    post:
      tags: ["Preview Sessions"]
      summary: Start a preview session
      description: Start a preview session
      operationId: postPreviewSession
      requestBody:
        $ref: "#/components/requestBodies/EvidenceRequestBody"
      responses:
        "201":
          $ref: "#/components/responses/PreviewResponseBody"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/TimeoutResponse"
  "/evidence/preview-sessions/{conversationId}/files":
    get:
      tags: ["Preview Sessions"]
      summary: Retrieve evidence files after preview
      description: Retrieve evidence files after preview
      operationId: getPreviewSessionFiles
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ConversationId"
      responses:
        "200":
          $ref: "#/components/responses/EvidencePlainResponse"
        "202":
          $ref: "#/components/responses/ProcessingOrDeferredEvidenceResponse"
        "400":
          $ref: "#/components/responses/InvalidConversationIdResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "404":
          $ref: "#/components/responses/EvidenceExchangeNotFoundResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/TimeoutResponse"

  "/evidences":
    post:
      tags: ["Evidences"]
      summary: Request and attempt to retrieve evidence directly without preview
      description: Request and attempt to retrieve evidence directly without preview
      operationId: postEvidence
      requestBody:
        $ref: "#/components/requestBodies/EvidenceRequestBody"
      responses:
        "200":
          $ref: "#/components/responses/EvidencePlainResponse"
        "202":
          $ref: "#/components/responses/ProcessingEvidenceResponse"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "409":
          $ref: "#/components/responses/ConflictResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
        "504":
          $ref: "#/components/responses/TimeoutResponse"

  "/selector-link":
    post:
      tags: ["Evidences selector link"]
      summary: Request a temporary link to evidence selector frontend
      description: Request a temporary link to evidence selector frontend
      operationId: postEvidenceSelectorLink
      requestBody:
        $ref: "#/components/requestBodies/EvidenceSelectorLinkRequest"
      responses:
        "201":
          $ref: "#/components/responses/EvidenceSelectorLinkResponse"
        "400":
          $ref: "#/components/responses/BadRequestErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidAccessTokenResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"

security:
  - oAuth2ClientCredentials: [read]

components:
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: See https://docs.swedenconnect.se/technical-framework/sdg/sdg-oauth2-profile.html
      flows:
        clientCredentials:
          tokenUrl: https://auth.accept.digg.se/oauth2/token
          scopes:
            read: Grant read-only access

  schemas:
    AccessService:
      type: object
      required: [identifier]
      properties:
        identifier:
          $ref: "#/components/schemas/Identifier"
        name:
          $ref: "#/components/schemas/MultiLingualString"
        conformsTo:
          type: array
          items:
            type: string
        publisher:
          $ref: "#/components/schemas/Publisher"
    Address:
      type: object
      required: [fullAddress, locatorDesignator, postCode, postCityName, adminUnitLevelOne, adminUnitLevelTwo]
      properties:
        fullAddress:
          type: string
          minLength: 1
        locatorDesignator:
          type: string
          minLength: 1
        postCode:
          type: string
          minLength: 1
        postCityName:
          type: string
          minLength: 1
        thoroughfare:
          type: string
        adminUnitLevelOne:
          type: string
          minLength: 1
        adminUnitLevelTwo:
          type: string
          minLength: 1
    CodeType:
      type: object
      properties:
        value:
          type: string
    ConversationId:
      type: string
      format: uuid
      example: "ff8919ba-740b-3ec3-bbe4-15f9ace4ca41"
    Country:
      type: string
      nullable: false
    DataServiceEvidenceType:
      type: object
      required: [identifier, evidenceTypeClassification, title, distributedAs, accessService]
      properties:
        identifier:
          $ref: "#/components/schemas/Identifier"
        evidenceTypeClassification:
          $ref: "#/components/schemas/EvidenceTypeClassification"
        title:
          $ref: "#/components/schemas/MultiLingualString"
        distributedAs:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceTypeDistributionType"
        accessService:
          $ref: "#/components/schemas/AccessService"
        authenticationLevelOfAssurance:
          $ref: "#/components/schemas/CodeType"
    DistributionFormat:
      type: string
      minLength: 1
    EvidenceFile:
      type: object
      properties:
        mimetype:
          type: string
        content:
          type: string
          format: byte
        filename:
          type: string
        identifier:
          type: string
        issuingAuthority:
          type: object
          properties:
            id:
              type: string
            name:
              $ref: "#/components/schemas/MultiLingualString"
        isConformantTo:
          type: object
          properties:
            evidenceTypeClassification:
              type: string
            description:
              $ref: "#/components/schemas/MultiLingualString"
            title:
              $ref: "#/components/schemas/MultiLingualString"
        issuingDate:
          type: string
          format: date
          example: "2024-03-15"
        distribution:
          type: object
          properties:
            format:
              type: string
            language:
              type: array
              items:
                type: string
            conformsTo:
              type: string
            transformation:
              type: string
        validityPeriod:
          type: object
          properties:
            startDate:
              type: string
              format: date
            endDate:
              type: string
              format: date
    EvidenceFilesBody:
      type: object
      required: [evidenceFiles]
      properties:
        evidenceFiles:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceFile"
    EvidenceType:
      type: object
      properties:
        evidenceTypeClassification:
          $ref: "#/components/schemas/EvidenceTypeClassification"
        title:
          $ref: "#/components/schemas/MultiLingualString"
        description:
          $ref: "#/components/schemas/MultiLingualString"
        jurisdictions:
          type: array
          items:
            $ref: "#/components/schemas/JurisdictionType"
    EvidenceTypeClassification:
      type: string
      format: uri
    EvidenceTypeDistributionType:
      type: object
      required: [format]
      properties:
        format:
          $ref: "#/components/schemas/DistributionFormat"
        transformation:
          type: string
    EvidenceTypes:
      type: object
      properties:
        evidenceTypes:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceType"
    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
        - UNSPECIFIED
    Identifier:
      type: object
      required: [value]
      properties:
        schemeId:
          type: string
        value:
          type: string
          minLength: 1
    JurisdictionAdminLevelTwo:
      type: string
      minLength: 3
      maxLength: 5
      description: The level two administration code for a specific jurisdiction context expressed using 3 to 5 letter NUTS code.
      example: SE321
      externalDocs:
        url: https://code.europa.eu/oots/tdd/tdd_chapters/-/blob/master/OOTS-EDM/codelists/External/NutsCodes.gc
    JurisdictionAdminLevelThree:
      type: string
      description: The level three administration code for a specific jurisdiction context expressed using LAU Code.
      example: 21001
      externalDocs:
        url: https://code.europa.eu/oots/tdd/tdd_chapters/-/blob/master/OOTS-EDM/codelists/OOTS/LAU2022-CodeList.gc
    JurisdictionType:
      type: object
      properties:
        adminUnitLevelOne:
          $ref: "#/components/schemas/Country"
        adminUnitLevelTwo:
          $ref: "#/components/schemas/JurisdictionAdminLevelTwo"
        adminUnitLevelThree:
          $ref: "#/components/schemas/JurisdictionAdminLevelThree"
    MultiLingualString:
      description: "String in various languages"
      type: object
      additionalProperties:
        type: string
      example:
        EN: Something in English.
        DE: Etwas auf Deutsch.
    NaturalPerson:
      type: object
      required: [familyName, givenName, dateOfBirth]
      properties:
        levelOfAssurance:
          type: string
        identifier:
          description: eIDAS unique identifier.
          type: string
          example: "SE/IT/197309069289"
        familyName:
          type: string
          minLength: 1
        givenName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
          format: date
          example: "2024-03-15"
        placeOfBirth:
          type: string
        currentAddress:
          $ref: "#/components/schemas/Address"
        gender:
          $ref: "#/components/schemas/Gender"
    Procedure:
      type: object
      required: [identifier, name]
      properties:
        name:
          type: string
        identifier:
          type: string
          minLength: 1
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
    ProcedureId:
      type: string
      example: "R1"
      externalDocs:
        url: https://code.europa.eu/oots/tdd/tdd_chapters/-/blob/master/OOTS-EDM/codelists/OOTS/Procedures-CodeList.gc
    Procedures:
      type: object
      properties:
        procedure:
          type: array
          items:
            $ref: "#/components/schemas/Procedure"
    Publisher:
      required: [identifier]
      type: object
      properties:
        identifier:
          $ref: "#/components/schemas/Identifier"
        name:
          $ref: "#/components/schemas/MultiLingualString"
        address:
          $ref: "#/components/schemas/Address"
        jurisdiction:
          $ref: "#/components/schemas/JurisdictionType"
    ReferenceFramework:
      type: object
      required: [identifier]
      properties:
        identifier:
          $ref: "#/components/schemas/SimpleIdentifier"
        title:
          $ref: "#/components/schemas/MultiLingualString"
        description:
          $ref: "#/components/schemas/MultiLingualString"
        relatedTo:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceFramework"
    SimpleIdentifier:
      type: string
      example: f8ea170d-09fc-4381-88d3-645fa978c132
    RequesterAgent:
      type: object
      required: [organizationIdentifier, name]
      properties:
        organizationIdentifier:
          $ref: "#/components/schemas/OrganizationNumber"
        name:
          $ref: "#/components/schemas/MultiLingualString"
        address:
          $ref: "#/components/schemas/Address"
    Requirement:
      type: object
      required: [id, name, countries]
      properties:
        id:
          $ref: "#/components/schemas/RequirementId"
        name:
          $ref: "#/components/schemas/MultiLingualString"
        countries:
          type: array
          items:
            $ref: "#/components/schemas/Country"
        referenceFramework:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceFramework"
    RequirementId:
      description: Describing the needs of the procedure with regard to the evidence request or a particular piece of information
      type: string
      format: uri
      example: "https://sr.acc.oots.tech.ec.europa.eu/requirements/ff8919ba-740b-3ec3-bbe4-15f9ace4ca41"
    Requirements:
      type: object
      properties:
        requirements:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
    OrganizationNumber:
      description: Identifier of an organization, provided as a Swedish organization number (organisationsnummer).
      type: string
      pattern: '\d{10}'
      example: "2021006883"
    ErrorBody:
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
          minLength: 1
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        method:
          type: string
          description: HTTP method used in the request (e.g., POST, GET, PUT, DELETE)
        additionalInfo:
          type: array
          items:
            type: string
    DeferredEvidenceResponseBody:
      title: "DeferredEvidenceResponseBody"
      description: "Empty JSON body used for 202 deferred responses. It might be possible to fetch later."
      type: object
      additionalProperties: false
    ProcessingEvidenceResponseBody:
      title: "ProcessingEvidenceResponseBody"
      description: "The ProcessingEvidenceResponseBody object includes information about an estimate of when the evidence is available (Delayed evidence)"
      type: object
      properties:
        estimatedAvailability:
          description: "Describes an estimate in RFC 3339 date/time when the evidence is available"
          type: string
        evidenceResponseType:
          type: string
          enum: [ProcessingEvidenceResponse]
      required: [estimatedAvailability, evidenceResponseType]

  parameters:
    countryParamOptional:
      name: countryCode
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Country"
      example: "SE"
    adminLevelTwoParam:
      name: jurisdictionAdminLevelTwo
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/JurisdictionAdminLevelTwo"
      example: "SE321"
    adminLevelThreeParam:
      name: jurisdictionAdminLevelThree
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/JurisdictionAdminLevelThree"
      example: "21001"

  requestBodies:
    EvidenceRequestBody:
      required: true
      content:
        application/json:
          schema:
            title: "EvidenceRequestBody"
            type: object
            required:
              [
                conversationId,
                evidenceTypeClassification,
                distributedAs,
                countryCode,
                requirementId,
                requesterAgent,
                naturalPerson
              ]
            properties:
              conversationId:
                $ref: "#/components/schemas/ConversationId"
              evidenceTypeClassification:
                $ref: "#/components/schemas/EvidenceTypeClassification"
              distributedAs:
                $ref: "#/components/schemas/DistributionFormat"
              countryCode:
                $ref: "#/components/schemas/Country"
              jurisdictionAdminLevelTwo:
                $ref: "#/components/schemas/JurisdictionAdminLevelTwo"
              jurisdictionAdminLevelThree:
                $ref: "#/components/schemas/JurisdictionAdminLevelThree"
              jurisdictionContextId:
                type: string
              procedureId:
                $ref: "#/components/schemas/ProcedureId"
              requirementId:
                $ref: "#/components/schemas/RequirementId"
              requesterAgent:
                $ref: "#/components/schemas/RequesterAgent"
              providerAgentId:
                type: string
              naturalPerson:
                $ref: "#/components/schemas/NaturalPerson"
          example:
            countryCode: NL
            procedureId: "00"
            requirementId: >-
              https://sr.oots.tech.ec.europa.eu/requirements/00000000-0000-0000-0000-000000000000
            evidenceTypeClassification: >-
              https://sr.oots.tech.ec.europa.eu/evidencetypeclassifications/NL/a6fa6bc6-022c-46dd-8885-fb88ed6259a6
            distributedAs: application/pdf
            providerAgentId: "12345"
            requesterAgent:
              organizationIdentifier: "2021006883"
              name:
                EN: Digg
                SV: Digg
              address:
                fullAddress: Storgatan 37
                locatorDesignator: "0"
                postCode: "85233"
                postCityName: Sundsvall
                adminUnitLevelOne: SE
                adminUnitLevelTwo: SE321
                thoroughfare: ""
            naturalPerson:
              givenName: Nina
              familyName: Greger
              identifier: SE/SE/197309069289
              dateOfBirth: "1973-09-06"
              levelOfAssurance: Substantial
              placeOfBirth: Stockholm
              gender: FEMALE
            conversationId: 5516b3c9-5f21-46ca-b774-bbdd82ead1c4
    EvidenceSelectorLinkRequest:
      required: true
      content:
        application/json:
          schema:
            title: "EvidenceSelectorLinkRequest"
            type: object
            required: [naturalPerson]
            properties:
              naturalPerson:
                $ref: "#/components/schemas/NaturalPerson"
          example:
            naturalPerson:
              givenName: Nina
              familyName: Greger
              identifier: SE/SE/197309069289
              dateOfBirth: "1973-09-06"
              levelOfAssurance: Substantial
              placeOfBirth: Stockholm
              gender: FEMALE
              currentAddress:
                fullAddress: Storgatan 37
                locatorDesignator: "0"
                postCode: "85233"
                postCityName: Sundsvall
                adminUnitLevelOne: SE
                adminUnitLevelTwo: SE321
                thoroughfare: ""
  responses:
    PreviewResponseBody:
      description: "Evidence preview details"
      content:
        application/json:
          schema:
            title: "PreviewResponseBody"
            type: object
            required: [description, url]
